<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiMove - Gestão de Transporte MVC</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 24px; color: #1e293b; }
        .header { max-width: 1050px; margin: 0 auto 20px auto; }
        .container { max-width: 1050px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 24px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        h1, h2 { margin-top: 0; color: #0f172a; }
        label { display: block; margin-top: 12px; font-weight: bold; font-size: 14px; }
        input, select, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 6px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        button { background: #2563eb; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 16px; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-success { background: #16a34a; padding: 6px 12px; margin: 0; width: auto; }
        .btn-success:hover { background: #15803d; }
        .alert { max-width: 1050px; margin: 0 auto 16px auto; padding: 12px 16px; border-radius: 6px; display: none; font-weight: bold; box-sizing: border-box; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
        .alert-ok { background: #dcfce7; color: #166534; border: 1px solid #4ade80; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-pendente { background: #fef3c7; color: #92400e; }
        .badge-concluida { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="header">
        <h1>LogiMove — Painel Operacional de Cargas (MVC)</h1>
    </div>
    <div id="feedback" class="alert"></div>
    <div class="container">
        <div class="card">
            <h2>Nova Ordem de Transporte</h2>
            <form id="formOrdem">
                <label for="rastreio">Código de Rastreio *</label>
                <input type="text" id="rastreio" placeholder="Ex: BR-2026-001" required>

                <label for="origem">Origem *</label>
                <input type="text" id="origem" placeholder="Ex: CD Curitiba - Doca 2" required>

                <label for="destino">Destino *</label>
                <input type="text" id="destino" placeholder="Ex: Filial Joinville" required>

                <label for="peso">Peso da Carga (kg) *</label>
                <input type="number" id="peso" step="0.1" min="1" placeholder="Ex: 450" required>

                <label for="veiculo">Veículo Alocado *</label>
                <select id="veiculo" required></select>

                <button type="submit" id="btnSalvar">Registrar Ordem</button>
            </form>
        </div>

        <div class="card">
            <h2>Ordens Registradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>Rastreio</th>
                        <th>Rota</th>
                        <th>Peso (kg)</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabelaOrdens"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarDados() {
            const res = await fetch('/api/dados');
            const data = await res.json();

            const select = document.getElementById('veiculo');
            const btnSalvar = document.getElementById('btnSalvar');
            select.innerHTML = '';
            let disponiveis = 0;

            data.veiculos.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.id_veiculo;
                opt.textContent = `${v.placa} - ${v.modelo} (Máx: ${v.capacidade_kg}kg) [${v.status_operacional}]`;
                if (v.status_operacional !== 'DISPONIVEL') {
                    opt.disabled = true;
                } else {
                    disponiveis++;
                }
                select.appendChild(opt);
            });

            btnSalvar.disabled = disponiveis === 0;

            const tbody = document.getElementById('tabelaOrdens');
            tbody.innerHTML = '';
            data.ordens.forEach(o => {
                const tr = document.createElement('tr');
                const badgeClass = o.status_ordem === 'PENDENTE' ? 'badge-pendente' : 'badge-concluida';
                tr.innerHTML = `
                    <td><strong>${o.codigo_rastreio}</strong></td>
                    <td>${o.origem} ➔ ${o.destino}</td>
                    <td>${o.peso_carga_kg} kg</td>
                    <td><span class="badge ${badgeClass}">${o.status_ordem}</span></td>
                    <td>${o.status_ordem === 'PENDENTE' ? `<button class="btn-success" onclick="concluirOrdem(${o.id_ordem})">Concluir</button>` : 'Finalizada'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function exibirMensagem(texto, erro = false) {
            const box = document.getElementById('feedback');
            box.style.display = 'block';
            box.className = 'alert ' + (erro ? 'alert-error' : 'alert-ok');
            box.textContent = texto;
        }

        document.getElementById('formOrdem').addEventListener('submit', async (e) => {
            e.preventDefault();
            const veiculoId = document.getElementById('veiculo').value;
            if (!veiculoId) {
                exibirMensagem('Selecione um veículo disponível válido.', true);
                return;
            }
            const payload = {
                codigo_rastreio: document.getElementById('rastreio').value,
                origem: document.getElementById('origem').value,
                destino: document.getElementById('destino').value,
                peso_carga_kg: document.getElementById('peso').value,
                id_veiculo: veiculoId
            };
            const res = await fetch('/api/ordens', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const retorno = await res.json();
            if (!res.ok) {
                exibirMensagem(retorno.erro, true);
            } else {
                exibirMensagem(retorno.mensagem, false);
                document.getElementById('formOrdem').reset();
                carregarDados();
            }
        });

        async function concluirOrdem(id) {
            const res = await fetch(`/api/ordens/${id}/concluir`, { method: 'PATCH' });
            const retorno = await res.json();
            exibirMensagem(retorno.mensagem || retorno.erro, !res.ok);
            carregarDados();
        }

        carregarDados();
    </script>
</body>
</html>
